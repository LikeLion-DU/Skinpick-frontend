name: skinplate
description: 오늘의 피부를 위한 오늘의 한 끼
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 라우팅
  go_router: ^14.2.7

  # 네트워크
  dio: ^5.7.0

  # 모델
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 저장소
  flutter_secure_storage: ^9.2.2

  # 기록 사진을 앱 documents 에 남긴다. 캐시 디렉터리는 OS 가 임의로 비운다.
  path_provider: ^2.1.5

  # 카메라 · 이미지
  image_picker: ^1.1.2
  camera: ^0.11.0                       # 얼굴 게이트(§9.5) 실시간 프리뷰
  flutter_image_compress: ^2.3.0
  image: ^4.2.0                         # 얼굴 크롭 + 평균 휘도 계산

  # 온디바이스 얼굴 감지 (게이트 + 크롭 전용, 피부 판정에는 쓰지 않는다)
  google_mlkit_face_detection: ^0.11.1

  # 온디바이스 이미지 라벨링 — "음식으로 보이는가" 만 본다.
  # 음식 종류·영양성분은 촬영 후 서버의 OpenAI Vision 이 정한다.
  #
  # 0.14 는 face_detection 0.11 과 google_mlkit_commons 버전이 어긋난다.
  # 얼굴 게이트는 실기기로 임계값·yaw 부호까지 맞춰 놓은 상태라 그쪽을 올리지 않고
  # 이쪽을 맞춘다. 둘 다 올리려면 얼굴 게이트를 다시 실기기 검증해야 한다.
  google_mlkit_image_labeling: ^0.12.1

  # InputImage · InputImageMetadata 를 직접 참조한다 (두 ML Kit 패키지의 공통 타입).
  google_mlkit_commons: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  # 시안이 쓰는 폰트. 공식 저장소 v1.3.9 의 static OTF 를 그대로 넣었다.
  # 라이선스는 SIL OFL 1.1 이라 앱 동봉이 허용된다 (assets/fonts/OFL.txt).
  #
  # 9종 웨이트 중 시안에 실제로 쓰이는 셋만 넣는다. 한글 폰트는 한 벌이
  # 1.5MB 라 전부 넣으면 APK 가 14MB 늘어난다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
