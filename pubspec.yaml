name: skinplate
description: 오늘의 피부를 위한 오늘의 한 끼
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 라우팅
  go_router: ^14.2.7

  # 네트워크
  dio: ^5.7.0

  # 모델
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 저장소
  flutter_secure_storage: ^9.2.2

  # 기록 사진을 앱 documents 에 남긴다. 캐시 디렉터리는 OS 가 임의로 비운다.
  path_provider: ^2.1.5

  # 카메라 · 이미지
  image_picker: ^1.1.2
  camera: ^0.11.0                       # 얼굴 게이트(§9.5) 실시간 프리뷰
  flutter_image_compress: ^2.3.0
  image: ^4.2.0                         # 얼굴 크롭 + 평균 휘도 계산

  # 온디바이스 얼굴 감지 (게이트 + 크롭 전용, 피부 판정에는 쓰지 않는다)
  google_mlkit_face_detection: ^0.11.1

  # 온디바이스 이미지 라벨링 — "음식으로 보이는가" 만 본다.
  # 음식 종류·영양성분은 촬영 후 서버의 OpenAI Vision 이 정한다.
  #
  # 0.14 는 face_detection 0.11 과 google_mlkit_commons 버전이 어긋난다.
  # 얼굴 게이트는 실기기로 임계값·yaw 부호까지 맞춰 놓은 상태라 그쪽을 올리지 않고
  # 이쪽을 맞춘다. 둘 다 올리려면 얼굴 게이트를 다시 실기기 검증해야 한다.
  google_mlkit_image_labeling: ^0.12.1

  # InputImage · InputImageMetadata 를 직접 참조한다 (두 ML Kit 패키지의 공통 타입).
  google_mlkit_commons: ^0.8.1

  # 시안 아이콘을 그대로 쓴다. 디자이너가 쓴 아이콘 세트(Solar·Material Round)를
  # Material 기본 아이콘으로 바꿔 그리면 획 굵기와 모서리가 미묘하게 달라진다.
  # 화면당 아이콘이 4~9개라 PNG 로 받으면 해상도별로 관리해야 해서 벡터로 간다.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # 시안이 쓰는 폰트. 공식 저장소 v1.3.9 의 static OTF 를 그대로 넣었다.
  # 라이선스는 SIL OFL 1.1 이라 앱 동봉이 허용된다 (assets/fonts/OFL.txt).
  #
  # 9종 웨이트 중 시안이 실제로 쓰는 넷만 넣는다. 한글 폰트는 한 벌이
  # 1.5MB 라 전부 넣으면 APK 가 14MB 늘어난다.
  #
  # 넷이 다 필요하다 — 시안에서 확인한 쓰임이다. Medium 을 빠뜨리면 본문
  # 대부분이 Regular 로 떨어지는데, 앱은 죽지 않고 글자만 얇아진다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

# 런처 아이콘 생성 설정. 생성물은 커밋한다(팀원이 명령을 다시 돌리지 않게).
#
# **`dart run flutter_launcher_icons` 를 맨손으로 부르지 말고 `tools/gen_icons.sh`
# 를 쓸 것.** 0.14.4 가 아이콘과 무관한 Xcode 빌드 설정을 덮어쓰고 애셋 카탈로그를
# 한 줄로 밀어 쓴다 — 스크립트가 그 둘을 뒤에서 되돌린다. 이유는 스크립트 주석에.
flutter_launcher_icons:
  image_path: "assets/icons/app_logo.png"
  android: true
  ios: true

  # iOS 앱 아이콘은 알파를 허용하지 않아, 알파가 남아 있으면 App Store 업로드가 거부된다.
  remove_alpha_ios: true
  # 알파를 지운 자리를 흰색 대신 브랜드 오렌지로 채운다. 원본 모서리 반경(29.5%)이
  # iOS 마스크(22.4%)보다 커서 흰색으로 채우면 마스크 **안쪽에** 흰 테두리가 남는다.
  background_color_ios: "#FF6520"

  # adaptive icon 을 켜지 않으면 Android 가 원본을 레거시 아이콘으로 보고 흰 원 안에
  # 축소해 넣는다 — 마크가 아이콘의 절반도 안 되게 나온다. 배경을 브랜드 오렌지로
  # 깔고 원본을 전경으로 얹으면 원본의 오렌지 판이 배경에 묻혀 마크만 보인다.
  #
  # 전경 전용(마크만 있는 투명 배경) 에셋이 없어서 쓰는 우회다. 그 에셋이 생기면
  # foreground 를 그것으로 바꾸는 게 맞다. 색은 원본 그라디언트(#FF7131 → #FF570E)의
  # 중간값이라 가장자리에 얇은 색 차이가 남는다.
  adaptive_icon_background: "#FF6520"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
